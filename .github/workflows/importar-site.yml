name: Importar arquivos do site
on:
  push:
    branches: [main]
    paths:
      - 'Futebolisticos_GitHub_Pages.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Extrair arquivos HTML, CSS e imagens
        run: |
          unzip -oq Futebolisticos_GitHub_Pages.zip
          rm -f Futebolisticos_GitHub_Pages.zip
      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publica paginas e imagens do Futebolisticos"
          git push origin HEAD:main
